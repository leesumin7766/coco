# version: '3.8'

services:
  db:
    image: mariadb:10.6
    container_name: coco-db
    restart: always
    command: ["--init-file=/docker-entrypoint-initdb.d/reapply-init.sql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-yeezydb}
    ports:
      - "3307:3306" # 로컬 3306, 호스트 3307
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/reapply-init.sql:/docker-entrypoint-initdb.d/reapply-init.sql:ro
      - ./sql/monitoring-grants.sql:/docker-entrypoint-initdb.d/20-monitoring-grants.sql:ro
      - ./sql/monitoring-events.sql:/docker-entrypoint-initdb.d/30-monitoring-events.sql:ro
      - ./monitoring/mariadb/slow-query.cnf:/etc/mysql/conf.d/slow-query.cnf:ro

  backend:
    image: coco-backend:local
    container_name: coco-backend
    restart: always
    #    ports:
    #        - "8080:8080"
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 호스트 로컬에 띄운 MariaDB 연결 (application.yml 대신 덮어쓰기)
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/${MYSQL_DATABASE:-yeezydb}
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
      # JPA 설정
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=true
      # Redis는 compose 네트워크 내 redis 컨테이너를 가리킵니다
      - SPRING_DATA_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_REDIS_PORT}
      # JWT / Toss Secret
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      # ACTUATOR + PROMETHEUS FIX
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
    depends_on:
      - db
      - redis

  frontend:
    image: docker.io/sumin19987766/coco-frontend:latest

    container_name: coco-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # redis-exporter
  redis-exporter:
    image: oliver006/redis_exporter
    container_name: coco-redis-exporter
    restart: always
    ports:
      - "9121:9121"
    command: ["--redis.addr=redis://${SPRING_REDIS_HOST}:${SPRING_REDIS_PORT}"]
    depends_on:
      - redis

  # mariadb-exporter
  mariadb-exporter:
    image: prom/mysqld-exporter:v0.18.0
    container_name: coco-mariadb-exporter
    restart: always
    ports:
      - "9104:9104"
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=root
      - --collect.global_status
      - --collect.global_variables
      - --collect.info_schema.innodb_metrics
      - --collect.info_schema.processlist
      - --collect.info_schema.tables
      - --collect.perf_schema.eventsstatements
      - --collect.perf_schema.eventswaits
      - --collect.perf_schema.tableiowaits
      - --web.listen-address=:9104
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db

  # node-exporter
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: coco-node-exporter
    restart: always
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($|/)"
    volumes:
      - /:/host:ro

  # cadvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: coco-cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # process-exporter (mariadbd process CPU/IO)
  process-exporter:
    image: ncabatoff/process-exporter:latest
    container_name: coco-process-exporter
    restart: always
    command:
      - "--procfs=/host/proc"
      - "--config.path=/config/process-exporter.yml"
    volumes:
      - /proc:/host/proc:ro
      - ./monitoring/process-exporter.yml:/config/process-exporter.yml:ro

  # Loki
  loki:
    image: grafana/loki:2.9.8
    container_name: coco-loki
    restart: always
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  # Promtail
  promtail:
    image: grafana/promtail:2.9.8
    container_name: coco-promtail
    restart: always
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - db_data:/var/lib/mysql:ro
    depends_on:
      - loki
      - db

  # prometheus
  prometheus:
    image: prom/prometheus
    container_name: coco-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/db-alerts.yml:/etc/prometheus/db-alerts.yml:ro
    depends_on:
      - backend
      - redis-exporter
      - mariadb-exporter
      - node-exporter
      - cadvisor
      - promtail

  # Grafana
  grafana:
    image: grafana/grafana
    container_name: coco-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GRAFANA_MYSQL_USER=${GRAFANA_MYSQL_USER:-grafana_reader}
      - GRAFANA_MYSQL_PASSWORD=${GRAFANA_MYSQL_PASSWORD:-grafana_reader_password}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - db

  # SQL report runner (periodic)
  sql-report-runner:
    image: mariadb:10.6
    container_name: coco-sql-report-runner
    restart: always
    working_dir: /work
    entrypoint: ["/bin/bash", "/work/monitoring/sql-report/run-report-loop.sh"]
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DB=${MYSQL_DATABASE:-yeezydb}
      - MYSQL_EXTRA_OPTS=--skip-ssl
      - SQL_REPORT_INTERVAL_SECONDS=${SQL_REPORT_INTERVAL_SECONDS:-86400}
    volumes:
      - ./:/work
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: coco-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
  loki_data:
