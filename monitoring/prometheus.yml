global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/db-alerts.yml

scrape_configs:
  # Spring Boot
  - job_name: 'coco-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  # Redis Exporter (캐시 히트율)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # MariaDB Exporter
  - job_name: 'mariadb'
    static_configs:
      - targets: ['mariadb-exporter:9104']

  # Host node metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Container metrics (DB CPU/IO 포함)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Promtail self metrics
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
