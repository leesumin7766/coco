server:
  port: 8080
  address: 0.0.0.0

spring:
  devtools:
    restart:
      enabled: false
  profiles:
    active: dev # 로컬 기본: dev. 배포에선 SPRING_PROFILES_ACTIVE=prod 로 지정


  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update            # 테이블은 JPA가 생성/갱신
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:700ms}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

jwt:
  secret-key: ThisIsASecretKeyForJwtTokenGenerationExample123!

toss:
  secret-key: ${TOSS_SECRET_KEY}

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.springframework.security: DEBUG   # <- 보안 관련 디버깅 로그
    com.example.shop: DEBUG               # <- 내 애플리케이션 로그

redis:
  resilience:
    cache:
      failure-threshold: ${REDIS_CACHE_FAILURE_THRESHOLD:3}
      open-duration-ms: ${REDIS_CACHE_OPEN_DURATION_MS:30000}
      probe-interval-ms: ${REDIS_CACHE_PROBE_INTERVAL_MS:5000}
    jwt-blacklist-fail-closed: ${REDIS_JWT_BLACKLIST_FAIL_CLOSED:true}

security:
  oauth2:
    client:
      registration:
        naver:
          client-id: 네이버_앱_클라이언트_ID
          client-secret: ${NAVER_CLIENT_SECRET}
          client-name: Naver
          authorization-grant-type: authorization_code
          redirect-uri: "{baseUrl}/login/oauth2/code/naver"
          scope:
            - name
            - email
            - profile_image
      provider:
        naver:
          authorization-uri: https://nid.naver.com/oauth2.0/authorize
          token-uri: https://nid.naver.com/oauth2.0/token
          user-info-uri: https://openapi.naver.com/v1/nid/me
          user-name-attribute: response
# ========================================
# dev profile
# ========================================
---
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT_DEV:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT_DEV:700ms}
  cache:
    type: redis
    data:
      redis:
        host: localhost
        port: 6379

  datasource:
    url: jdbc:mariadb://localhost:3307/yeezydb
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 3000
      idle-timeout: 10000
      max-lifetime: 30000

  # data.sql 실행
  sql:
    init:
      mode: never
      data-locations: classpath:/data.sql

  jpa:
    defer-datasource-initialization: false

# ========================================
# prod profile
# ========================================
---
spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT_PROD:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT_PROD:500ms}

  cache:
    type: redis
    data:
      redis:
        host: redis
        port: 6379

  datasource:
    url: jdbc:mariadb://db:3306/yeezydb
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  # data.sql 실행
  sql:
    init:
      mode: never
      data-locations: classpath:/data.sql
  jpa:
    defer-datasource-initialization: true
